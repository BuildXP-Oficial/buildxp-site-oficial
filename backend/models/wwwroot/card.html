  <style>
    /* ── LOADING STATE ─────────────────────────────────────── */
    .card-loading {
      min-height: 60vh;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 1.25rem; text-align: center;
    }
    .card-loading-icon {
      font-size: 2.5rem;
      animation: pulse-glow 1.5s ease-in-out infinite;
    }
    .card-loading-text {
      font-family: var(--f-mono); font-size: 0.75rem;
      color: var(--text-muted); letter-spacing: 4px;

    .card-loading-bar {
      width: 180px; height: 2px;

    .card-loading-fill {
      height: 100%; width: 0%;
      background: var(--accent, var(--git));
      border-radius: 99px;

      100% { width: 100%; }

      min-height: 50vh;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 1rem; text-align: center;
    }
    .card-error-code {

      font-weight: 900; color: var(--npm);
      text-shadow: 0 0 30px rgba(255,79,79,0.4);
    }
    .card-error-msg {
      font-family: var(--f-heading); font-size: 1rem;
      color: var(--text-dim); max-width: 360px;
    }
    .card-error-back {
      font-family: var(--f-display); font-size: 0.72rem;
      letter-spacing: 3px; padding: 0.85rem 2rem;
      background: transparent; border: 1.5px solid var(--text-muted);
      color: var(--text-muted); border-radius: var(--radius-sm);
      text-decoration: none; margin-top: 0.5rem;
      transition: border-color var(--t-fast), color var(--t-fast);

    .card-error-back:hover { border-color: var(--text); color: var(--text); }

      background: rgba(255,255,255,0.05);

      font-size: 0.62rem;

<script>
function escapeHtml(str) {
  return String(str ?? '')
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

/** Caminho relativo ou URL de imagem (não emoji/HTML curto). */
function cardHtmlIsImageSrc(s) {
  const t = String(s || '').trim();
  if (!t || t.length > 512) return false;
  if (/^https?:\/\//i.test(t)) return true;
  if (t.startsWith('/api/card/')) return true;
  if (/\.(png|jpe?g|gif|webp|svg)(\?|$)/i.test(t)) return true;
  return t.startsWith('imagens/') || t.startsWith('/imagens/');
}

function slideConteudos(slide) {
  return slide.conteudos || slide.Conteudos || [];
}

const BXP_SLIDE_PAUSE_TITULO = '__buildxp_pause__';

function slideHasApiBody(s) {
  const d = String(s?.descricao ?? s?.Descricao ?? '').trim();
  if (d) return true;
  return slideConteudos(s).length > 0;
}

const CARD_PAGE_ICON_FALLBACKS = {
  git: { dual: true, a: 'imagens/gitlogobr.png', b: 'imagens/githublogo.png', altA: 'Git', altB: 'GitHub' },
  docker: { dual: false, a: 'imagens/dockerlogo.png', b: '', altA: 'Docker', altB: '' },
  npm: { dual: false, a: 'imagens/npmlogo.png', b: '', altA: 'NPM', altB: '' },
  dotnet: { dual: false, a: 'imagens/csharplogo.png', b: '', altA: '.NET', altB: '' },
  ia: { dual: false, a: 'imagens/ia.png', b: '', altA: 'IA', altB: '' },
  python: { dual: false, a: 'imagens/PYTHON.png', b: '', altA: 'Python', altB: '' },
  api: { dual: false, a: 'imagens/API.png', b: '', altA: 'API', altB: '' },
};

function cardPageIconAlt(card) {
  const raw = String(
    card.icon_primary_alt || card.IconPrimaryAlt || card.display_name || card.DisplayName || card.slug || '',
  ).trim();
  const short = raw.split(':')[0].split('|')[0].trim();
  return escapeHtml(short || String(card.display_name || card.DisplayName || card.slug || 'BuildXP'));
}

/** Hero: só imagens/caminhos válidos; emoji ou lixo na API → fallback pelo slug. */
function buildCardPageIconHtml(card) {
  const layout = String(card.icon_layout || card.IconLayout || 'single').toLowerCase();
  const pri = String(card.icon_primary_src || card.IconPrimarySrc || '').trim();
  const sec = String(card.icon_secondary_src || card.IconSecondarySrc || '').trim();
  const altPri = cardPageIconAlt(card);
  const altSec = escapeHtml(
    String(card.icon_secondary_alt || card.IconSecondaryAlt || '').split(':')[0].trim(),
  );
  const slug = String(card.slug || '').trim().toLowerCase();
  const fb = CARD_PAGE_ICON_FALLBACKS[slug];
  const imgOnError = fb?.a
    ? ` onerror="this.onerror=null;this.src='${escapeHtml(fb.a)}';"`
    : '';

  if (layout === 'dual' && cardHtmlIsImageSrc(pri) && cardHtmlIsImageSrc(sec)) {
    return `<div class="page-icon dual"><img class="icon-git" src="${escapeHtml(pri)}" alt="${altPri}"${imgOnError} /><img src="${escapeHtml(sec)}" alt="${altSec}" /></div>`;
  }
  if (cardHtmlIsImageSrc(pri)) {
    return `<div class="page-icon"><img src="${escapeHtml(pri)}" alt="${altPri}"${imgOnError} /></div>`;
  }
  if (fb?.dual && fb.b) {
    return `<div class="page-icon dual"><img class="icon-git" src="${escapeHtml(fb.a)}" alt="${escapeHtml(fb.altA)}" /><img src="${escapeHtml(fb.b)}" alt="${escapeHtml(fb.altB)}" /></div>`;
  }
  if (fb?.a) {
    return `<div class="page-icon"><img src="${escapeHtml(fb.a)}" alt="${escapeHtml(fb.altA)}" /></div>`;
  }
  return '<div class="page-icon"><img src="imagens/logo2buildxpret.png" alt="BuildXP" /></div>';
}

/**
 * Separa observação final "(Obs.: …)" colada no mesmo bloco; promove .step-desc que só explicam Obs.;
 * normaliza \n nas áreas de texto.
 */
function cardPromoteObservationsAndSplit(html) {
  let h = String(html || '').trim();
  if (!h) return '';

  const obsParenIdx = h.lastIndexOf('(Obs.:');
  if (obsParenIdx >= 0) {
    const before = h.slice(0, obsParenIdx).trimEnd();
    let obsTail = h.slice(obsParenIdx).trim();
    const closeIdx = obsTail.lastIndexOf(')');
    if (closeIdx > 0) obsTail = obsTail.slice(0, closeIdx + 1);
    const tailLooksObs = /^\(\s*Obs\.:/i.test(obsTail.replace(/^[\s\uFEFF]+/, ''));
    if (tailLooksObs && before.length > 0) {
      const obsEsc = escapeHtml(obsTail).replace(/\n/g, '<br>');
      h = `${before}<div class="callout callout-tip">💡 ${obsEsc}</div>`;
    }
  }

  try {
    const doc = new DOMParser().parseFromString(`<div id="card-parse">${h}</div>`, 'text/html');
    const root = doc.getElementById('card-parse');
    if (!root) return h;
    root.querySelectorAll('.step-desc').forEach((el) => {
      const raw = el.innerHTML.trim();
      const t = el.textContent.trim();
      if (
        /^\(?\s*Obs\.:/i.test(t) ||
        /^Observação\b/i.test(t) ||
        /<strong>\s*Obs\.:/i.test(raw)
      ) {
        const callout = doc.createElement('div');
        callout.className = 'callout callout-tip';
        callout.innerHTML = `💡 ${el.innerHTML}`;
        el.replaceWith(callout);
      }
    });
    /* Sem HTML (<tags>): quebras \\n úteis. Com HTML: \\n já colapsam em espaço; forçar <br> fazia forte/código partir linha só por formatação do editor */
    root.querySelectorAll('.step-desc').forEach((el) => {
      const inner = el.innerHTML;
      if (!/<[a-z][\s\S]*>/i.test(inner)) el.innerHTML = inner.replace(/\r\n|\r|\n/g, '<br>');
    });
    h = root.innerHTML;
  } catch (_) {
    /* keep string h */
  }

  return h;
}

/** Agrupa corpo do slide com rótulos TEXTO / COMANDOS / OBSERVAÇÃO (ordem preservada). */
function cardWrapSlideBodySections(innerHtml) {
  const x = String(innerHtml || '').trim();
  if (!x) return '';
  const doc = new DOMParser().parseFromString(`<div id="card-sec">${x}</div>`, 'text/html');
  const root = doc.getElementById('card-sec');
  if (!root) return `<div class="card-dynamic-slide">${x}</div>`;

  let container = root;
  if (
    root.children.length === 1 &&
    root.firstElementChild &&
    root.firstElementChild.tagName === 'DIV' &&
    !root.firstElementChild.classList.contains('cmd-block') &&
    !root.firstElementChild.classList.contains('callout')
  ) {
    const only = root.firstElementChild;
    if (only.querySelector('.cmd-block') || only.querySelector('.callout')) container = only;
  }

  /**
   * Junta texto + &lt;strong&gt;, &lt;code&gt;, &lt;a&gt;, etc. num único .step-desc.
   * Partir por cada elemento no 1.º nível criava vários blocos e “partia linha” após cada strong.
   */
  const parts = [];
  let textHtmlBuf = '';

  function flushTextHtmlBuf(partsOut) {
    const trimmed = textHtmlBuf.trim();
    textHtmlBuf = '';
    if (!trimmed) return;
    const div = doc.createElement('div');
    div.className = 'step-desc';
    const looksPlain =
      trimmed.indexOf('<') < 0 || !/<[a-z][\s\S]*>/i.test(trimmed);
    if (looksPlain) {
      trimmed.split(/\r\n|\r|\n/).forEach((line, i) => {
        if (i > 0) div.appendChild(doc.createElement('br'));
        div.appendChild(doc.createTextNode(line));
      });
    } else {
      /* Quebras vindas só da formatação do textarea (entre strong/code) → espaço (HTML colapsável). Para parágrafos usa <br> ou <p>. */
      div.innerHTML = trimmed.replace(/\r\n|\r|\n/g, ' ');
    }
    partsOut.push({ type: 'text', el: div });
  }

  for (const node of [...container.childNodes]) {
    if (node.nodeType === Node.TEXT_NODE || node.nodeType === Node.CDATA_SECTION_NODE) {
      textHtmlBuf += node.textContent;
      continue;
    }
    if (node.nodeType !== Node.ELEMENT_NODE) continue;

    const el = /** @type {Element} */ (node);
    if (el.classList.contains('cmd-block') || el.classList.contains('callout')) {
      flushTextHtmlBuf(parts);
      const type = el.classList.contains('cmd-block') ? 'cmd' : 'obs';
      parts.push({ type, el: el.cloneNode(true) });
    } else {
      textHtmlBuf += el.outerHTML;
    }
  }
  flushTextHtmlBuf(parts);

  if (!parts.length) return `<div class="card-dynamic-slide">${x}</div>`;

  const wrap = doc.createElement('div');
  wrap.className = 'card-dynamic-slide';
  let lastType = '';
  parts.forEach(({ type, el }) => {
    if (type !== lastType) {
      const lab = doc.createElement('div');
      lab.className = 'slide-field-label';
      lab.textContent = type === 'cmd' ? 'COMANDOS' : type === 'obs' ? 'OBSERVAÇÃO' : 'TEXTO';
      wrap.appendChild(lab);
      lastType = type;
    }
    wrap.appendChild(el.cloneNode(true));
  });
  return wrap.outerHTML;
}

/** Pausa sem título reservado na API (dados antigos / import). */
function cardIsLikelyPauseSlide(slide) {
  const tituloRaw = String(slide.titulo ?? slide.Titulo ?? '').trim();
  const desc = String(slide.descricao ?? slide.Descricao ?? '');
  if (tituloRaw) return false;
  if (/<div class="cmd-block"/i.test(desc)) return false;
  if (/<div class="step-title"/i.test(desc)) return false;
  return /respira|relaxa|alongar|Muita coisa de uma vez|baixa a bola|Cheap Codes|Cheat Codes|Referência rápida|👏|🎯|☕|\bkk\b/i.test(
    desc,
  );
}

/** Texto plano → fragmentos (step-desc / callout), sem wrapper de secções. */
function cardPlainSlideBodyInner(desc) {
  const raw = String(desc || '');
  let main = raw;
  let obs = '';
  const idx = raw.lastIndexOf('(Obs.:');
  if (idx >= 0) {
    main = raw.slice(0, idx).trimEnd();
    obs = raw.slice(idx).trim();
    const ci = obs.lastIndexOf(')');
    if (ci > 0) obs = obs.slice(0, ci + 1);
  }
  let html = `<div class="step-desc">${escapeHtml(main).replace(/\n/g, '<br>')}</div>`;
  if (obs && /^\(\s*Obs\.:/i.test(obs)) {
    html += `<div class="callout callout-tip">💡 ${escapeHtml(obs).replace(/\n/g, '<br>')}</div>`;
  }
  return html;
}

/** Texto plano do dashboard → HTML com observação destacada e secções. */
function cardPlainSlideBodyToHtml(desc) {
  return cardWrapSlideBodySections(cardPlainSlideBodyInner(desc));
}

function renderError(code, msg, root) {
  root.innerHTML = `
    <div class="card-error">
      <div class="card-error-code">${escapeHtml(code)}</div>
      <p class="card-error-msg">${escapeHtml(msg)}</p>
      <a href="index.html" class="card-error-back">← VOLTAR AO INÍCIO</a>
    </div>`;
}

(async function () {
  // ── 1. LÊ PARÂMETROS DA URL ──────────────────────────────
  const params = new URLSearchParams(window.location.search);
  const slug   = params.get('slug');
  const tabParam = params.get('tab'); // 'beginner' ou 'ref'

  const root = document.getElementById('page-root');

  // ── 2. VALIDA SLUG ───────────────────────────────────────
  if (!slug) {
    renderError('400', 'Nenhum card foi especificado na URL.', root);
    return;
  }

  // ── 3. BUSCA DADOS NA API ────────────────────────────────
  let card;
  try {
    const apiBase =
      typeof getBuildXpApiBase === 'function'
        ? String(getBuildXpApiBase()).replace(/\/$/, '')
        : '';
    const res = await fetch(`${apiBase}/api/card/${encodeURIComponent(slug)}`, {
      credentials: 'same-origin',
      headers: { Accept: 'application/json' },
      cache: 'no-store',
    });
    if (!res.ok) throw new Error(String(res.status));
    card = await res.json();
  } catch {
    renderError('404', `Card "${slug}" não encontrado ou API indisponível.`, root);
    return;
  }

  // ── 4. ACCENT: border_color da API ou fallback por tema ───
  function hexToRgbTuple(hex) {
    const n = String(hex || '').replace('#', '').trim();
    if (!/^[0-9a-fA-F]{6}$/.test(n)) return '57,211,83';
    const r = parseInt(n.slice(0, 2), 16);
    const g = parseInt(n.slice(2, 4), 16);
    const b = parseInt(n.slice(4, 6), 16);
    return `${r},${g},${b}`;
  }
  const themePresetAccent = {
    git: '#39d353',
    docker: '#2496ed',
    npm: '#cb3837',
    dotnet: '#512bd4',
    api: '#22d3ee',
    python: '#3776ab',
    ia: '#3c19e6',
  };
  const rawBorder = card.border_color ?? card.BorderColor ?? '';
  let accent = typeof rawBorder === 'string' && /^#[0-9a-fA-F]{6}$/.test(rawBorder.trim())
    ? rawBorder.trim().toLowerCase()
    : (themePresetAccent[card.theme] || themePresetAccent.git);
  const glow = hexToRgbTuple(accent);
  document.documentElement.style.setProperty('--accent', accent);
  document.documentElement.style.setProperty('--accent-glow',
    `0 0 24px rgba(${glow},0.4), 0 0 60px rgba(${glow},0.12)`);
  document.documentElement.style.setProperty('--accent-rgb', glow);

  try {
  // ── 5. ATUALIZA TÍTULO DA PÁGINA ─────────────────────────
  document.title = `${String(card.display_name ?? card.DisplayName ?? slug)} — BuildXP`;

  // ── 6. CALCULA XP ────────────────────────────────────────
  const xpAtual = Number(card.xp_current ?? card.XpCurrent ?? 0) || 0;
  const xpMaxRaw = Number(card.xp_max ?? card.XpMax ?? 3000);
  const xpMax = xpMaxRaw > 0 ? xpMaxRaw : 3000;
  const xpPct = Math.min(Math.round((xpAtual / xpMax) * 100), 100);
  const xpLabel =
    typeof buildxpFormatXpPair === 'function'
      ? buildxpFormatXpPair(xpAtual, xpMax)
      : `${xpAtual} / ${xpMax}`;

  // ── 7. SEPARA SLIDES POR TIPO ────────────────────────────
  const slides = (card.slides || card.Slides || []).sort(
    (a, b) => (Number(a.ordem ?? a.Ordem) || 0) - (Number(b.ordem ?? b.Ordem) || 0),
  );
  const refsRaw = card.referencias || card.Referencias || [];
  const referencias = [...refsRaw].sort((a, b) => {
    const oca = a.ordem_categoria ?? a.OrdemCategoria ?? 0;
    const ocb = b.ordem_categoria ?? b.OrdemCategoria ?? 0;
    if (oca !== ocb) return oca - ocb;
    return (a.ordem_item ?? a.OrdemItem ?? 0) - (b.ordem_item ?? b.OrdemItem ?? 0);
  });

  const slidesInner = renderSlides(slides, slug);
  const refsInner = renderReferencias(referencias);

  // ── 8. RENDERIZA HTML ────────────────────────────────────
  root.innerHTML = `
    <a href="cards.html" class="back-link">← VOLTAR AOS CARDS</a>

    <div class="page-hero">
      <div class="page-hero-glow"></div>
      ${buildCardPageIconHtml(card)}
      <div class="page-hero-body">
        <div class="page-class">${escapeHtml(String(card.card_class ?? card.CardClass ?? ''))}</div>
        <div class="page-title">${escapeHtml(String(card.display_name ?? card.DisplayName ?? ''))}</div>
        <div class="page-meta">
          <span class="lvl-badge">${card.rarity_label ?? card.RarityLabel ?? 'CARD'}</span>
          <div class="xp-mini">
            <div class="xp-mini-fill" style="width:${xpPct}%"></div>
          </div>
          <span class="xp-mini-label">${xpLabel}</span>
        </div>
      </div>
    </div>

    <div class="tabs">
      <button class="tab-btn ${tabParam !== 'ref' ? 'active' : ''}" data-tab="beginner">▶ INICIANTE</button>
      <button class="tab-btn ${tabParam === 'ref' ? 'active' : ''}" data-tab="ref">🎮 CHEAP CODES</button>
    </div>

    <div class="tab-pane ${tabParam !== 'ref' ? 'active' : ''}" id="beginner">
      <div class="steps-slider" data-steps-slider>
        <button class="steps-nav" type="button" aria-label="Anterior" data-slide-prev>‹</button>
        <div class="steps steps-track" id="steps-root">
        ${slidesInner}
        </div>
        <button class="steps-nav" type="button" aria-label="Próximo" data-slide-next>›</button>
        <div class="steps-index" data-steps-index aria-label="Índice clicável dos slides"></div>
      </div>
    </div>

    <div class="tab-pane ${tabParam === 'ref' ? 'active' : ''}" id="ref">
      <div class="ref-search-wrap">
        <span class="search-icon">🔍</span>
        <input class="ref-search" id="ref-search" type="text"
               placeholder="Buscar comando..." />
      </div>
      ${refsInner}
      <div class="ref-empty" id="ref-empty" hidden>// NENHUM COMANDO ENCONTRADO</div>
    </div>
  `;

  // ── 9. INICIALIZA INTERATIVIDADE ─────────────────────────
  initTabs();
  initCopy();
  initSearch();
  initMenu();
  initScroll();
  if (typeof initStepsSlider === 'function') initStepsSlider();
  } catch (err) {
    console.error(err);
    renderError(
      '500',
      'Erro ao montar este card. Recarrega com Ctrl+F5 ou abre a consola (F12) para ver o detalhe.',
      root,
    );
  }

})();

function cardBuildFinSlideHtml(slug, finSlide) {
  if (typeof buildxpFinSlideHtml === 'function') return buildxpFinSlideHtml(slug, finSlide);
  const cheatHref = `card.html?slug=${encodeURIComponent(slug)}&tab=ref`;
  return `
    <div class="step step--fim">
      <div class="step-num">🏆</div>
      <div class="card-fim-body">
        <div class="step-title">Parabéns! 🏆</div>
        <div class="step-desc">Você concluiu a trilha iniciante. Pratique no terminal ou consulte os cheap codes.</div>
        <div class="term-actions card-fim-actions">
          <a href="index.html#terminal" class="term-btn primary">INICIAR TREINAMENTO</a>
          <a href="${cheatHref}" class="term-btn ghost">🎮 VERIFICAR CHEAP CODES</a>
        </div>
      </div>
    </div>`;
}

function cardIsFinSlide(slide) {
  return detectTipo(slide) === 'fim';
}

// ── RENDERIZA SLIDES ──────────────────────────────────────────
function renderSlides(slides, slug) {
  const finFromApi = (slides || []).find((s) => cardIsFinSlide(s));
  const contentSlides = (slides || []).filter((s) => !cardIsFinSlide(s));

  if (!contentSlides.length && !finFromApi) {
    return `${cardBuildFinSlideHtml(slug, null)}`;
  }

  const body = contentSlides.map((slide, idx) => {
    const tipo = detectTipo(slide);

    // Slide de PAUSA
    if (tipo === 'pausa') {
      const tRaw = String(slide.titulo ?? slide.Titulo ?? '').trim();
      const showPauseTitle = tRaw && tRaw !== BXP_SLIDE_PAUSE_TITULO && !/^pausa$/i.test(tRaw);
      const pd = String(slide.descricao ?? slide.Descricao ?? '');
      const pauseBody =
        pd && /<[a-z][\s\S]*>/i.test(pd)
          ? cardPromoteObservationsAndSplit(pd)
          : pd
            ? `<div class="step-desc">${escapeHtml(pd).replace(/\n/g, '<br>')}</div>`
            : '';
      return `
        <div class="step step-pause">
          <div class="step-num">PAUSA</div>
          <div>
            ${showPauseTitle ? `<div class="step-title">${escapeHtml(slide.titulo ?? slide.Titulo)}</div>` : ''}
            ${pauseBody}
          </div>
        </div>`;
    }

    // Slide de CONTEÚDO normal
    const num = String(idx + 1).padStart(2, '0');
    const conts = slideConteudos(slide);
    const desc = String(slide.descricao ?? slide.Descricao ?? '');
    const descIsHtml = /<[a-z][\s\S]*>/i.test(desc);
    const tituloSlide = String(slide.titulo ?? slide.Titulo ?? '').trim();
    const titleHtml = tituloSlide ? `<div class="step-title">${escapeHtml(tituloSlide)}</div>` : '';

    // Dashboard grava texto + cmd-block + callout num único HTML em `descricao` (sem linhas em ConteudosSlide).
    if (conts.length === 0) {
      if (!desc.trim()) {
        return `
      <div class="step">
        <div class="step-num">${num}</div>
        <div>${titleHtml}</div>
      </div>`;
      }
      if (descIsHtml) {
        const bodyHtml = cardWrapSlideBodySections(cardPromoteObservationsAndSplit(desc));
        return `
      <div class="step">
        <div class="step-num">${num}</div>
        <div>${titleHtml}${bodyHtml}</div>
      </div>`;
      }
      return `
      <div class="step">
        <div class="step-num">${num}</div>
        <div>${titleHtml}${cardPlainSlideBodyToHtml(desc)}</div>
      </div>`;
    }

    let descPart = '';
    if (desc.trim()) {
      if (descIsHtml) descPart = cardPromoteObservationsAndSplit(desc);
      else descPart = cardPlainSlideBodyInner(desc);
    }

    const codigoHTML = conts
      .filter((c) => c.tipo === 0 || c.tipo === 'Comando' || c.tipo === 'comando')
      .map((c) => `
        <div class="cmd-block">
          <button class="copy-btn">copy</button>
          <code>${escapeHtml(c.texto || c.Texto || '')}</code>
          ${c.descricao || c.Descricao ? `<div style="font-family:var(--f-body);font-size:0.82rem;
                                       color:var(--text-muted);margin-top:0.5rem;">
                             ${c.descricao || c.Descricao}
                           </div>` : ''}
        </div>`).join('');

    const obsHTML = conts
      .filter((c) => c.tipo === 1 || c.tipo === 'Observacao' || c.tipo === 'observacao')
      .map((c) => `
        <div class="callout callout-tip">
          💡 ${c.texto || c.Texto || ''}
        </div>`).join('');

    const mergedBody = cardWrapSlideBodySections(`${descPart}${codigoHTML}${obsHTML}`);

    return `
      <div class="step">
        <div class="step-num">${num}</div>
        <div>
          ${titleHtml}
          ${mergedBody}
        </div>
      </div>`;
  }).join('');

  return `${body}${cardBuildFinSlideHtml(slug, finFromApi)}`;
}

// ── RENDERIZA REFERÊNCIAS ─────────────────────────────────────
function renderReferencias(refs) {
  if (!refs.length) {
    return '';
  }

  // Agrupa por categoria
  const grupos = {};
  refs.forEach((r) => {
    const cat = (r.categoria || r.Categoria || 'GERAL').trim() || 'GERAL';
    if (!grupos[cat]) grupos[cat] = [];
    grupos[cat].push(r);
  });

  return Object.entries(grupos).map(([cat, cmds]) => `
    <div class="ref-section">
      <div class="ref-section-title">${escapeHtml(cat)}</div>
      <div class="cmd-grid">
        ${cmds.map((c) => {
          const cmd = c.comando ?? c.Comando ?? '';
          const desc = c.descricao ?? c.Descricao ?? '';
          return `
          <div class="cmd-item">
            <span class="cmd-text">${escapeHtml(cmd)}</span>
            <span class="cmd-desc">${escapeHtml(String(desc))}</span>
            <button class="cmd-copy">copy</button>
          </div>`;
        }).join('')}
      </div>
    </div>`).join('');
}

// ── DETECTA TIPO DO SLIDE ─────────────────────────────────────
function detectTipo(slide) {
  const tituloRaw = String(slide.titulo ?? slide.Titulo ?? '').trim();
  const titulo = tituloRaw.toLowerCase();
  const desc = String(slide.descricao ?? slide.Descricao ?? '').toLowerCase();
  const tipo = String(slide.tipo ?? slide.Tipo ?? '').toLowerCase();

  if (tituloRaw === BXP_SLIDE_PAUSE_TITULO || /^pausa$/i.test(tituloRaw)) return 'pausa';
  if (tipo === 'pausa' || tipo === '2') return 'pausa';
  if (cardIsLikelyPauseSlide(slide)) return 'pausa';

  if (tipo === 'fim' || tipo === '3') return 'fim';
  if (tituloRaw === 'FIM' || /^conclus(ão|ao)?$/i.test(tituloRaw)) return 'fim';

  return 'conteudo';
}

</script>
