# Postgres local para quem clona/faz fork.
# Estas credenciais NÃO são o banco de produção (Neon/Azure).
# Produção fica só em Azure App Settings ou `dotnet user-secrets`.

services:
  postgres:
    image: postgres:16
    container_name: buildxp-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: buildxp
      POSTGRES_PASSWORD: buildxp123
      POSTGRES_DB: buildxpdb
    ports:
      - "5432:5432"
    volumes:
      - buildxp-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U buildxp -d buildxpdb"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  buildxp-data:
